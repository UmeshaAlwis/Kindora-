name: kindora
description: Kindora - Charity Donation Platform
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.5.6
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.3.0
  riverpod_generator: ^2.2.0
  
  # Networking
  dio: ^5.1.0
  http: ^1.1.0
  
  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.1.0
  
  # Firebase
  firebase_core: ^2.14.0
  firebase_auth: ^4.7.0
  cloud_firestore: ^4.9.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.2.0
  
  # Payment Gateway
  pay: ^1.1.0
  
  # UI & Navigation
  get: ^4.6.0
  go_router: ^9.0.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.2.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.0.0
  
  # Localization
  intl: ^0.20.0
  easy_localization: ^3.0.0
  
  # Notifications
  awesome_notifications: ^0.10.1
  
  # Utilities
  uuid: ^3.0.0
  equatable: ^2.0.0
  get_it: ^7.5.0
  dartz: ^0.10.0
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # Image Picker
  image_picker: ^1.0.0
  
  # Camera
  camera: ^0.10.0
  
  # Maps
  google_maps_flutter: ^2.2.0
  
  # Analytics
  firebase_analytics: ^10.5.0
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.2.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
